name: Review site

# Scores the eTenders OCDS feed and deploys the detection review page to
# Cloudflare Pages. Does nothing until the repository variable
# REVIEW_SITE_ENABLED is "true", which is set only after Cloudflare Access
# protects the site: the page names real companies next to unvalidated scores.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-site
  cancel-in-progress: true

env:
  PAGES_PROJECT: g2-tender-review
  WRANGLER: wrangler@4.142.0
  OCDS_URL: https://data.open-contracting.org/en/publication/143/download?name=full.jsonl.gz

jobs:
  deploy:
    if: vars.REVIEW_SITE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run pytest -q

      - name: Download eTenders OCDS feed
        run: >
          curl --fail --show-error --silent --location
          --retry 3 --retry-delay 10 --max-time 300
          --output "$RUNNER_TEMP/full.jsonl.gz" "$OCDS_URL"

      - name: Score awards and write public JSON
        run: >
          uv run python scripts/build_review_data.py
          --ocds "$RUNNER_TEMP/full.jsonl.gz" --out review-site/data

      - name: Create the Pages project on first run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes "$WRANGLER" pages project list | grep -qw "$PAGES_PROJECT"; then
            echo "Pages project $PAGES_PROJECT exists"
          else
            npx --yes "$WRANGLER" pages project create "$PAGES_PROJECT" --production-branch=main
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes "$WRANGLER" pages deploy review-site
          --project-name="$PAGES_PROJECT" --branch=main --commit-dirty=true
