name: Deploy dashboard

# Scores the eTenders OCDS feed, builds the dashboard and deploys it to
# Cloudflare Pages.
#
# - Push to main: production at https://g2-tender-monitor.pages.dev
# - Daily at 04:17 SAST: production again, so new awards in the feed are
#   scored without anyone pushing. GitHub disables this schedule after 60
#   days without repository activity.
# - Pull request from a branch in this repo: a preview deployment, with its
#   URL posted as a comment on the PR.
#
# Production runs also read the imported CIPC company and director records
# from Supabase and write the scoring run back, when the DATABASE_URL secret
# is set. A failed database write fails the run before
# the deploy, so the site never shows a run the database does not hold.
#
# The Pages project is Direct Upload (no Cloudflare Git integration), because
# the build needs the Python scoring step; previews therefore come from here.
# PRs from forks get no secrets and are skipped.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  # A newer push supersedes an old PR preview, but a production run is never
  # cancelled half way through a deploy: it queues behind the one running.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PAGES_PROJECT: g2-tender-monitor
  WRANGLER: wrangler@4.142.0
  OCDS_URL: https://data.open-contracting.org/en/publication/143/download?name=full.jsonl.gz

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Gate
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          echo "deploy=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::Not deploying: Cloudflare secrets are not available to this run."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.deploy == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.gate.outputs.deploy == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.gate.outputs.deploy == 'true'

      - name: Test the engine
        if: steps.gate.outputs.deploy == 'true'
        run: uv sync --locked && uv run pytest -q

      - name: Download eTenders OCDS feed
        if: steps.gate.outputs.deploy == 'true'
        run: >
          curl --fail --show-error --silent --location
          --retry 3 --retry-delay 10 --max-time 300
          --output "$RUNNER_TEMP/full.jsonl.gz" "$OCDS_URL"

      # Production runs (push to main, the schedule, manual) also write to the
      # database. PR previews never do: same-repo PRs can read secrets, and a
      # branch must not be able to change production data.
      - name: Score awards and write public JSON
        if: steps.gate.outputs.deploy == 'true'
        env:
          DATABASE_URL: ${{ github.event_name != 'pull_request' && secrets.DATABASE_URL || '' }}
        run: |
          args=(--ocds "$RUNNER_TEMP/full.jsonl.gz" --out src/frontend/public/data)
          if [ -n "$DATABASE_URL" ]; then
            args+=(--write-db --cipc-from-db)
          elif [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::warning::DATABASE_URL secret is not set; skipping the database write."
          fi
          uv run python scripts/build_dashboard_data.py "${args[@]}"

      - name: Build the dashboard
        if: steps.gate.outputs.deploy == 'true'
        working-directory: src/frontend
        run: npm ci --ignore-scripts && npm test && npx --no-install vite build

      - name: Deploy
        id: deploy
        if: steps.gate.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Branch names come from PR authors; passed via env, never inlined.
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
        run: |
          npx --yes "$WRANGLER" pages deploy src/frontend/dist \
            --project-name="$PAGES_PROJECT" --branch="$BRANCH" --commit-dirty=true | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE "https://[a-z0-9.-]+\.${PAGES_PROJECT}\.pages\.dev" "$RUNNER_TEMP/deploy.log" | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice::Deployed $BRANCH to ${url:-https://$PAGES_PROJECT.pages.dev}"

      - name: Comment the preview URL on the PR
        if: steps.gate.outputs.deploy == 'true' && github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker="<!-- dashboard-preview -->"
          body="$marker
          **Dashboard preview:** $URL

          Built from $SHA with the latest eTenders data. Updates on every push to this PR."
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .id" | head -1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi
